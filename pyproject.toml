[project]
name = "pecs"
version = "0.1.0"
description = "PECS — Project Evidence Correlation System: a traceability engine for mapping project requirements to implementation evidence and evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # UI
    "streamlit>=1.30",
    # Vector store
    "chromadb>=0.4",
    # LLM and embedding API client
    "ollama",
    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    # Dataframes used by Streamlit pages
    "pandas>=3.0.5",
    # YAML front matter parsing
    "PyYAML>=6.0.3",
    # PDF parsing
    "pymupdf>=1.23",
    # DOCX parsing
    "python-docx>=1.0",
    # MIME detection
    "python-magic>=0.4",
    # Markdown normalization
    "markitdown[all]",
    # BM25 keyword retrieval
    "rank-bm25>=0.2",
    # Environment variable loading
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-mock",
]

[project.scripts]
pecs = "pecs.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pecs"]

[tool.hatch.build]
artifacts = ["pecs/ui/components/trace_graph_frontend/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requires an explicitly opted-in external service",
]
